[package]
name = "yappa_mls"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aes-gcm = "=0.10.3"
openmls = { version = "=0.8.1", default-features = false }
openmls_basic_credential = { version = "=0.5.0" }
openmls_memory_storage = { version = "=0.5.0" }
openmls_rust_crypto = { version = "=0.5.1" }
openmls_traits = { version = "=0.5.0" }
rand = "=0.8.7"
thiserror = "=2.0.19"
tls_codec = "=0.4.2"
zeroize = "=1.9.0"

[patch.crates-io]
# OpenMLS 0.8.1 pins hpke-rs 0.6.x, whose published manifest locks vulnerable
# libcrux dependencies. This source-compatible backport updates SHA3 to 0.0.10
# and removes the unused libcrux provider; Yappa uses the RustCrypto provider.
hpke-rs = { path = "vendor/hpke-rs" }
