name: yappa
description: "An open source, self hosted, next-generation social platform."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  http: ^1.2.2
  socket_io_client: ^3.1.1
  file_picker: ^10.3.9
  desktop_drop: ^0.6.1
  pasteboard: ^0.5.0
  url_launcher: ^6.3.0
  record: ^6.2.0
  flutter_webrtc: 1.5.2
  livekit_client: 2.9.0-dev.0
  cryptography: ^2.7.0
  crypto: ^3.0.7
  ffi: ^2.2.0
  image: ^4.8.0
  flutter_secure_storage: ^10.3.1
  path_provider: ^2.1.5
  webview_all: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  flutter_webrtc:
    path: packages/flutter_webrtc_yappa

flutter:
  uses-material-design: true
  assets:
    - assets/branding/yappa_logo.png
