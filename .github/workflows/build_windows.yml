name: Build Yappa Windows

on:
  push:
    branches: [codex/rebuild-desktop-workflows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yappa-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows development artifact
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Load pinned versions
        id: versions
        shell: bash
        run: .github/scripts/export-release-versions.sh

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ steps.versions.outputs.flutter }}

      - name: Show tool versions
        shell: pwsh
        run: |
          flutter --version
          cargo --version

      - name: Run shared client validation
        shell: bash
        run: .github/scripts/validate-client.sh

      - name: Build, inspect, smoke-test, and package Windows
        shell: pwsh
        run: >
          .github/scripts/build-windows.ps1
          -SafeVersion "${{ steps.versions.outputs.safe_yappa }}"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Yappa-windows-x64-${{ github.sha }}
          path: client/dist/Yappa-${{ steps.versions.outputs.safe_yappa }}-windows-x64.zip
          if-no-files-found: error

      - name: Upload Windows diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Yappa-windows-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/diagnostics/windows
          if-no-files-found: ignore
          retention-days: 14
