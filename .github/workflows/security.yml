name: Security and Test Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yappa-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend security suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.22.1
          package-manager-cache: false

      - name: Install locked dependencies
        working-directory: server
        run: npm ci

      - name: Audit production dependencies
        working-directory: server
        run: npm audit --omit=dev --audit-level=moderate

      - name: Run backend security tests
        working-directory: server
        run: npm test

  client:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.7

      - name: Install locked dependencies
        working-directory: client
        run: flutter pub get --enforce-lockfile

      - name: Build and test native MLS bridge
        working-directory: client/native/yappa_mls
        run: |
          cargo build --locked
          cargo test --locked

      - name: Run pinned OpenMLS vectors on Yappa graph
        run: client/native/yappa_mls/scripts/test_openmls_vectors.sh

      - name: Audit native MLS dependencies
        working-directory: client/native/yappa_mls
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

      - name: Analyze client
        working-directory: client
        run: flutter analyze

      - name: Run client tests
        working-directory: client
        run: flutter test
