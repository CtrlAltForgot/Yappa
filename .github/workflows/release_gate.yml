name: Public Release Gate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: yappa-public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  exact-release-contract:
    name: Exact tag and publication contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Reject development, mismatched, or unpublished releases
        run: node .github/scripts/validate-release-ref.js

      - name: Confirm publication remains externally authorized
        run: |
          echo "Exact tag contract passed."
          echo "Artifact publication is intentionally separate and requires"
          echo "platform signing identities plus explicit production authorization."
