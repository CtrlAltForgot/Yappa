name: Windows Server Lifecycle Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "server/Install-Yappa.ps1"
      - "server/install-yappa.sh"
      - "server/install-manifest.json"
      - "server/install-manifest.schema.json"
      - "server/test/install_manifest.js"
      - ".github/scripts/test-windows-server-contract.ps1"
      - ".github/workflows/server_windows_contract.yml"
  push:
    branches:
      - main
    paths:
      - "server/Install-Yappa.ps1"
      - "server/install-yappa.sh"
      - "server/install-manifest.json"
      - "server/install-manifest.schema.json"
      - "server/test/install_manifest.js"
      - ".github/scripts/test-windows-server-contract.ps1"
      - ".github/workflows/server_windows_contract.yml"

permissions:
  contents: read

concurrency:
  group: yappa-windows-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lifecycle-bridge:
    name: PowerShell to WSL lifecycle bridge
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Parse installer and validate manifest
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "server/Install-Yappa.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Install-Yappa.ps1 failed PowerShell syntax validation."
          }
          node server/test/install_manifest.js

      - name: Test argument-safe lifecycle dispatch
        shell: pwsh
        run: .github/scripts/test-windows-server-contract.ps1
